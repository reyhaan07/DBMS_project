{% extends "base.html" %}
{% block title %}Hospitals{% endblock %}
{% block content %}
<h2>Add Hospital</h2>
<form method="post" class="card form-grid">
  <input name="name" placeholder="Hospital name" required>
  <input name="city" placeholder="City" required>
  <input name="phone" pattern="[0-9]{10}" placeholder="10-digit phone" required>
  <button type="submit">Add Hospital</button>
</form>

<h2>Hospitals</h2>
<table>
  <tr><th>ID</th><th>Name</th><th>City</th><th>Phone</th><th>Total requests</th></tr>
  {% for h in hospitals %}
  <tr><td>{{ h.hospital_id }}</td><td>{{ h.name }}</td><td>{{ h.city }}</td><td>{{ h.phone }}</td><td>{{ h.total_requests }}</td></tr>
  {% endfor %}
</table>
{% endblock %}
